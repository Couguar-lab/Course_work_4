{% extends "base.html" %}
{% block title %}Удаление получателя{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить получателя?</h1>
    <p>Вы уверены, что хотите удалить <strong>{{ object.full_name }} ({{ object.email }})</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
