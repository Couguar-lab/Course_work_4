{% extends "base.html" %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow text-center">
                <div class="card-header bg-success text-white">
                    <h3>Письмо отправлено</h3>
                </div>
                <div class="card-body p-5">
                    <p class="lead">
                        Мы отправили инструкции по восстановлению пароля на ваш email.
                    </p>
                    <p class="text-muted">
                        Если письмо не пришло в течение нескольких минут — проверьте папку "Спам".
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-outline-primary mt-3">
                        Вернуться ко входу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
