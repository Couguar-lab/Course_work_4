{% extends "base.html" %}
{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить рассылку?</h1>
    <p>Вы уверены, что хотите удалить рассылку <strong>"{{ object.message.subject }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
